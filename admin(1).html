<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorts BD Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1220;color:#f5f7ff;font-family:system-ui,Arial;padding:18px}main{max-width:680px;margin:auto}.card{background:#1a2033;border:1px solid #303954;border-radius:16px;padding:16px;margin:14px 0}h1{font-size:24px;margin:0 0 6px}p{color:#b7c1d8}label{display:block;margin:12px 0 6px}input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #394562;background:#101729;color:white}button{background:#5c6cff;border:0;font-weight:700;margin-top:14px}small{color:#f6c76a}.preview{margin-top:12px;max-width:100%;border-radius:12px}#status{color:#87f0b0}</style></head><body><main><h1>🛠️ Shorts BD Admin</h1><p>Admin Panel — Upload UI Demo</p><div class="card"><h2>ভিডিও যোগ করুন</h2><label>ভিডিওর নাম</label><input id="title" placeholder="ভিডিওর শিরোনাম"><label>ভিডিও ফাইল নির্বাচন</label><input id="video" type="file" accept="video/*"><label>Thumbnail (ঐচ্ছিক)</label><input id="thumb" type="file" accept="image/*"><button onclick="previewUpload()">Preview</button><p id="status"></p><video id="pv" class="preview" controls hidden></video><img id="im" class="preview" hidden></div><div class="card"><h3>পরবর্তী উন্নয়ন</h3><p>এই Demo শুধু আপনার ফোনে নির্বাচিত ফাইলের preview দেখায়। প্রকৃত আপলোড, লগইন, ভিডিও সংরক্ষণ এবং ডিলিটের জন্য Backend/Storage সংযোগ পরবর্তী ধাপে যুক্ত করব।</p><small>এখানে কোনো গোপন API key দেবেন না।</small></div></main><script>function previewUpload(){let v=document.getElementById('video').files[0],t=document.getElementById('thumb').files[0],title=document.getElementById('title').value;let pv=document.getElementById('pv'),im=document.getElementById('im');if(!v){document.getElementById('status').textContent='প্রথমে একটি ভিডিও নির্বাচন করুন।';return}pv.src=URL.createObjectURL(v);pv.hidden=false;if(t){im.src=URL.createObjectURL(t);im.hidden=false}else im.hidden=true;document.getElementById('status').textContent='Preview প্রস্তুত: '+(title||v.name)+' — এখনো সার্ভারে আপলোড হয়নি।'}</script></body></html>
